spring:
  application:
    name: atsanalyzer

  datasource:
    url: ${ATS_DB_URL}
    username: ${ATS_DB_USERNAME}
    password: ${ATS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      initializationFailTimeout: 60000

  sql:
    init:
      mode: never

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      thread-name-prefix: resume-worker-

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  storage:
    upload-dir: uploads/resumes

    max-file-size-bytes: 5242880

    allowed-extensions:
      - pdf
      - docx

    allowed-content-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

logging:
  level:
    root: INFO
    com.faisal.dev.atsanalyzer: INFO